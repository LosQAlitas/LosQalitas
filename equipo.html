<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel del equipo - Los +Qalitas</title>

    <link rel="stylesheet" href="css/equipo.css" />
  </head>

  <body>
    <!-- =====================================
       LOGIN
  ====================================== -->

    <section id="pantalla-login" class="pantalla-login">
      <div class="login-card">
        <div class="login-logo">🍗</div>

        <h1>LOS +QALITAS</h1>

        <p>Panel del equipo</p>

        <form id="form-login">
          <label for="usuario"> Usuario </label>

          <input type="text" id="usuario" placeholder="Usuario" autocomplete="username" required />

          <label for="password"> Contraseña </label>

          <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required />

          <button type="submit" class="btn-login">Entrar</button>

          <p id="mensaje-login" class="mensaje-login"></p>
        </form>
      </div>
    </section>

    <!-- =====================================
       PANEL
  ====================================== -->

    <section id="panel-equipo" class="panel-equipo oculto">
      <header class="panel-header">
        <div>
          <h1>🔥 LOS +QALITAS</h1>

          <p>Panel del equipo</p>
        </div>

        <div class="panel-header-derecha">
          <span id="usuario-activo"> Usuario </span>

          <button type="button" id="btn-salir">Salir</button>
        </div>
      </header>

      <!-- ===================================
         RESUMEN
    ==================================== -->

      <section class="resumen">
        <div class="tarjeta-resumen">
          <span> Nuevos </span>

          <strong id="contador-nuevos"> 0 </strong>
        </div>

        <div class="tarjeta-resumen">
          <span> Preparando </span>

          <strong id="contador-preparando"> 0 </strong>
        </div>

        <div class="tarjeta-resumen">
          <span> Listos </span>

          <strong id="contador-listos"> 0 </strong>
        </div>
        <div class="tarjeta-resumen">
          <span> 💰 Ventas </span>

          <strong id="contador-ventas"> $0 </strong>
        </div>
      </section>

      <!-- ===================================
         FILTROS
    ==================================== -->

      <section class="filtros">
        <button type="button" class="filtro activo" data-filtro="todos">Todos</button>

        <button type="button" class="filtro" data-filtro="nuevo">Nuevos</button>

        <button type="button" class="filtro" data-filtro="preparando">Preparando</button>

        <button type="button" class="filtro" data-filtro="listo">Listos</button>
      </section>

      <!-- ===================================
         PEDIDOS
    ==================================== -->

      <main id="lista-pedidos-equipo" class="lista-pedidos-equipo">
        <div class="sin-pedidos">
          <div class="sin-pedidos-icono">📦</div>

          <h2>No hay pedidos</h2>

          <p>Los nuevos pedidos aparecerán aquí.</p>
        </div>
      </main>
    </section>

    <script src="js/equipo.js"></script>
  </body>
</html>
